<!--
  헤더 로고(Kwon5700)의 K를 파비콘 크기로 옮긴 것.
  색은 globals.css의 @theme 토큰 그대로, color-accent에서 color-accent-deep으로.
  (XML 주석 안에는 하이픈 두 개를 못 쓰니 토큰 이름의 접두 하이픈은 뺐다)

  글리프를 <text>가 아니라 스트로크로 그린 이유: 파비콘은 사용자 기기에 그 폰트가
  있으리라고 기대할 수 없다. 예전 아이콘은 Arial을 지정해 뒀는데, 없는 환경에서는
  제각각의 폰트로 렌더된다.

  같은 그림의 풀블리드·maskable 변형이 apple-icon.png와 public/icon-*.png에 있다.
  모양을 고치면 그쪽도 같이 다시 만들 것 — 안 그러면 탭과 홈 화면의 아이콘이 어긋난다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6b4f" />
      <stop offset="1" stop-color="#245640" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#t)" />
  <!--
    stroke-linejoin이 round여야 한다. 기본값 miter로 두면 대각선이 만나는 꼭짓점의
    미터 첨점이 세로획 왼쪽으로 1 만큼 삐져나와, 획 옆구리에 작은 혹이 생긴다.
  -->
  <g fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round">
    <path d="M20.75 13V51" />
    <path d="M44.95 16.3 22.75 32 44.95 47.7" />
  </g>
</svg>
